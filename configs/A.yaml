# Company A - mining operations, two systems (SAP goods receipts + AP invoice tool). Reports in ZAR.
company: A
output_name: A
data_dir: data/A
reporting_currency: ZAR

taxonomy:
  file: taxonomy_A.csv
  level_columns: [category_l1, category_l2, category_l3]

labels:
  file: labels_A.csv
  data_dir: data/A            # labels always come from the original build data (also for A2)
  id_column: record_id
  level_columns: [category_l1, category_l2, category_l3]

sources:
  - name: erp
    role: primary
    file: erp_goods_receipts.csv
    id_column: line_id
    id_prefix: "ERP:"
    amount: {column: value_zar, gross: false}          # ERP values are net
    currency: {fixed: ZAR}                             # value_zar is already in ZAR whatever document_currency says
    date: {columns: [posting_date], valid_from: "2015-01-01", valid_to: "2026-12-31"}
    supplier: {name_column: supplier_name, id_column: vendor_id}
    description: [material_short_text, service_short_text]
    item_description: [material_short_text]            # service text holds warranty/repair notes, not the item
    item_code: material_number
    quantity: quantity
    po: {column: po_number, item_column: po_item}
    classifier_text: [material_type]
    classifier_tokens: [spend_type, material_type, opex_capex, cost_centre]

  - name: tool
    role: secondary
    file: invoice_tool_export.csv
    id_column: tool_record_id
    id_prefix: "TOOL:"
    amount: {column: gross_amount, gross: true, vat_rate_column: vat_rate, default_vat_rate: 0.15}
    currency: {column: currency, default: ZAR}
    date: {columns: [invoice_date], dayfirst: true, valid_from: "2015-01-01", valid_to: "2026-12-31"}
    supplier: {name_column: supplier_name_as_captured}
    description: [line_text]
    quantity: quantity
    po: {column: po_reference, pattern: '(45\d{8})', item_pattern: '/(\d+)(?:\.0+)?\s*$'}
    invoice: {column: invoice_number}
    status: {column: status}
    # the same invoice line exported twice: same invoice number (digits), quantity and gross amount
    duplicate_keys: [invoice_digits, quantity, amount_raw]

# Client conventions found in labels_A (see DECISIONS.md):
supplier_dedup:
  unmastered:                 # names whose ERP records mostly have no vendor id = outside the vendor master
    key: UNMASTERED SUPPLIER
    id_share_below: 0.5
item_dedup:
  bucket_rules:               # catalogue / free-text buys with a material number but no material master data
    - key: UNMASTERED CATALOGUE ITEM
      sources: [erp]
      when:
        - {column: material_number, present: true}
        - {column: material_type, present: false}
        - {column: spend_type, pattern: '^(catalogue|free text)$'}

matching:
  primary: erp
  secondary: tool
  amount_tolerance_pct: 0.005
  amount_tolerance_abs: 0.05
  text_threshold: 85
